services:
  postgres:
    image: postgres:16
    container_name: monetria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: monetria_dev
    ports:
      - "5432:5432"
    volumes:
      - monetria_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d monetria_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  monetria_postgres_data:
